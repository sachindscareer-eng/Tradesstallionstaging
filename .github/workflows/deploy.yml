name: Deploy to staging

# Every push to main uploads the plugin to the staging site over FTP.
# One-time setup: repo Settings → Secrets and variables → Actions → New repository secret:
#   FTP_SERVER      e.g. ftp.tradestallion.com (Hostinger hPanel → Files → FTP Accounts)
#   FTP_USERNAME    FTP username
#   FTP_PASSWORD    FTP password
#   FTP_SERVER_DIR  plugin folder on the STAGING site, ending in /
#                   e.g. /public_html/staging/wp-content/plugins/tradestallion-design/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FTP secrets
        id: check
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ] || [ -z "$D" ]; then
            echo "FTP secrets not set yet – skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PHP syntax check
        if: steps.check.outputs.ready == 'true'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Upload plugin to staging
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
