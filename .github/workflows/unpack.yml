name: Unpack uploaded zip
on:
  push:
    paths: ['.github/workflows/unpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack plugin files to repo root
        run: |
          set -e
          [ -f Tradesstallionstaging-repo.zip ] || { echo "zip already unpacked"; exit 0; }
          unzip -o Tradesstallionstaging-repo.zip -d /tmp/unz
          cp -r /tmp/unz/tradestallion-design/. .
          cp /tmp/unz/README.md README.md
          git rm -q Tradesstallionstaging-repo.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack TradeStallion Design plugin to repo root"
          git push
